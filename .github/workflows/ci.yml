# Checks every push and pull request: lint, types, tests and a build.
name: Kontroll

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # A short play on an emulated phone (e2e/smoke.spec.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
